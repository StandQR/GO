<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WiFi del apartamento — La Ermita</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f4f7;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: #3A5068;
    color: white;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-back {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    font-size: 22px;
    width: 36px; height: 36px;
    border-radius: 10px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    flex-shrink: 0;
  }
  .header-title { font-size: 16px; font-weight: 700; }
  .header-sub { font-size: 12px; opacity: 0.75; margin-top: 2px; }

  .normas-page { padding: 0; background: #f0f4f7; flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  .normas-block { margin: 14px 16px 0; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .normas-block-header {
    background: #3A5068; color: white;
    padding: 12px 16px;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .normas-block-body { padding: 20px 16px; }

  .wifi-hero-icon {
    width: 64px; height: 64px;
    margin: 0 auto 12px;
    border-radius: 18px;
    background: #dff0f5;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }

  .wifi-note {
    text-align: center;
    font-size: 14px;
    color: #444;
    line-height: 1.6;
  }
  .wifi-note strong { color: #3A5068; }

  .wifi-highlight {
    margin-top: 14px;
    background: #EEF0FA;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 12.5px;
    color: #3A5068;
    line-height: 1.55;
    text-align: center;
  }

  .legal-footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 10px 16px 14px;
    background: #f0f4f7;
    flex-shrink: 0;
    border-top: 1px solid #d8e4ec;
  }
  .legal-links { display: flex; gap: 6px; align-items: center; }
  .legal-links a { font-size: 10.5px; color: #7a9ab0; text-decoration: none; letter-spacing: 0.01em; }
  .legal-links a:hover { color: #3A5068; }
  .legal-links-sep { font-size: 9px; color: #b0c4d0; }
  .legal-brand { font-size: 9px; color: #b0c4d0; letter-spacing: 0.04em; }
</style>
</head>
<body>

  <div class="header">
    <a class="header-back" onclick="history.back()">‹</a>
    <div>
      <div class="header-title">WiFi del apartamento</div>
      <div class="header-sub">Apartamento La Ermita</div>
    </div>
  </div>

  <div class="normas-page">

    <div class="normas-block">
      <div class="normas-block-header">🛜 Conexión WiFi</div>
      <div class="normas-block-body">
        <div class="wifi-hero-icon">🛜</div>
        <div class="wifi-note">El apartamento cuenta con <strong>WiFi de alta velocidad</strong>.</div>
        <div class="wifi-highlight">📝 El nombre de la red y la contraseña están anotados en el apartamento.</div>
      </div>
    </div>

  </div>

  <div class="legal-footer">
    <div class="legal-links">
      <a href="https://apartamentosgo.com/politica-de-privacidad/" target="_blank">Política de privacidad</a>
      <span class="legal-links-sep">·</span>
      <a href="https://apartamentosgo.com/aviso-legal/" target="_blank">Aviso legal</a>
    </div>
    <div class="legal-brand">Diseñado por StandQR</div>
  </div>

</body>
</html>
